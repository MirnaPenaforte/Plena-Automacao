# O nome do serviço é genérico ('app'). A diferenciação entre instâncias
# é feita pelo COMPOSE_PROJECT_NAME, IMAGE_NAME e CONTAINER_NAME no .env.
# Ex: COMPOSE_PROJECT_NAME=plena-automacao → projeto isolado "plena-automacao"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./output:/app/output
      - ./imports:/app/imports
      - ./logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "main.py"]
      interval: 1m
      timeout: 10s
      retries: 3
